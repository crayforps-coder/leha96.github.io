<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Успешная оплата</title>
  <!-- подключаю общее оформление -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- учебное сообщение после заполнения формы, платеж не проверяется -->
  <div class="registration payment-result">
    <div class="fields">
      <!-- галочка это обычный знак, цвет и размер заданы в стилях -->
      <div class="success-check" aria-hidden="true">✓</div>
      <h1>Успешная оплата</h1>
      <!-- маленький текст под заголовком, таймера здесь нет -->
      <p class="payment-note">Ожидайте поступления средств в течение 5 минут.</p>
      <p class="payment-note">Макет без настоящих платежей</p>
      <!-- возвращаюсь к форме пополнения -->
      <a href="topup.html">Назад</a>
    </div>
  </div>
</body>
</html>
