<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="registration">
    <h1>Регистрация</h1>

    <form action="topup.html" method="get">
      <div class="fields">
        <h2>Добро пожаловать на сайт Steam Payment</h2>
        <p>Заполните все поля. Пароль — не короче 6 знаков.</p>>
        <input type="email" placeholder="Введите почту"
          aria-label="Почта" title="Введите почту, например: name@mail.ru" required>
        <input type="password" placeholder="Придумайте пароль"
          aria-label="Пароль" title="Введите не меньше 6 знаков" minlength="6" required>
        <input type="password" placeholder="Повторите пароль"
          aria-label="Повторите пароль" title="Введите пароль ещё раз" minlength="6" required>
        <label class="robot-check">
          <input type="checkbox" required>
          Я не робот
        </label>
      </div>

      <div class="actions">
        <button type="submit">Дальше</button>
      </div>
    </form>
  </div>
</body>
</html>
